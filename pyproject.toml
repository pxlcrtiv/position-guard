[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "position-guard"
version = "0.1.0"
description = "DeFi health monitor — tracks Aave v3 / Compound v3 positions via The Graph public subgraphs, computes health factors, and pushes LLM-written plain-English alerts. Telegram optional, keyless web-preview demo by default."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pxlcrtiv" }]
keywords = ["defi", "ethereum", "aave", "compound", "health-factor", "alerts", "the-graph", "coingecko", "telegram", "monitoring", "web3", "liquidation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Finance",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.25",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
position-guard = "position_guard.cli:main"

[tool.setuptools.packages.find]
include = ["position_guard*"]

[tool.setuptools.package-data]
position_guard = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: hits the network (The Graph / CoinGecko) - mocked or fixture-backed in CI",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
# Intentional deviations (with rationale):
#   BLE001 - blind excepts isolate one alert/source from killing a whole watch loop.
#   PLW1510 - subprocess without check=: returncode handled explicitly (daily_update).
#   DTZ005/DTZ011 - calendar-day arithmetic in the daily-green script is
#                   deliberately local-time based (launchd schedules local days).
ignore = ["BLE001", "PLW1510", "DTZ005", "DTZ011"]